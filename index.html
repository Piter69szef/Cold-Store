<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CØLD | Official Store</title>
  <style>
    :root {
      --bg-dark: #0a0a0a;
      --bg-card: #141414;
      --brand-red: #ba0000;
      --text-main: #ffffff;
      --text-muted: #888888;
      --border-color: #222222;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.5;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(10, 10, 10, 0.95);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-logo-container {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand-logo-img {
      max-height: 35px;
      width: auto;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }

    .brand-name {
      font-weight: 900;
      font-size: 1.5rem;
      letter-spacing: 2px;
      color: var(--text-main);
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    nav a:hover {
      color: var(--text-main);
    }

    .cart-btn {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px;
    }

    .hero {
      background-color: var(--brand-red);
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      text-align: center;
      padding: 40px 20px;
      overflow: hidden;
    }

    .hero-bg-logo {
      position: absolute;
      width: 85%;
      max-width: 800px;
      opacity: 0.85;
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero-subheading {
      font-size: 0.9rem;
      letter-spacing: 3px;
      font-weight: 700;
      color: #000000;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .hero-title {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 4px 12px rgba(0,0,0,0.3);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    .section-title {
      font-size: 1.5rem;
      margin-bottom: 30px;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-left: 4px solid var(--brand-red);
      padding-left: 12px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .product-image-container {
      position: relative;
      width: 100%;
      padding-top: 100%;
      background: #111111;
    }

    .product-image-container img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .view-toggle {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0,0,0,0.8);
      border: 1px solid #444;
      color: white;
      padding: 6px 12px;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .product-info {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .product-price {
      font-size: 1.2rem;
      color: var(--brand-red);
      font-weight: bold;
      margin-bottom: 15px;
    }

    .add-to-cart-btn {
      margin-top: auto;
      width: 100%;
      padding: 12px;
      background: var(--brand-red);
      color: white;
      border: none;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
    }

    footer {
      border-top: 1px solid var(--border-color);
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-logo-container">
      <img src="parafka logo.png" alt="CØLD Logo" class="brand-logo-img">
      <a href="#" class="brand-name">CØLD</a>
    </div>

    <nav>
      <a href="#featured">Featured Products</a>
      <a href="#about">About</a>
      <button class="cart-btn" onclick="alert('Koszyk otwiera się...')">
        🛒 Koszyk (<span id="cart-count">0</span>)
      </button>
    </nav>
  </header>

  <section class="hero">
    <img src="parafka logo.png" alt="CØLD Signature" class="hero-bg-logo">
    <div class="hero-content">
      <div class="hero-subheading">CØLD A$ F_CK</div>
      <h1 class="hero-title">CØLD I$ F!RE</h1>
    </div>
  </section>

  <main class="container" id="featured">
    <h2 class="section-title">Featured Products</h2>
    <div class="product-grid" id="product-list"></div>
  </main>

  <footer>
    <div class="footer-links">
      <a href="#">Support</a>
      <a href="#">Track Order</a>
      <a href="#">Contact Us</a>
      <a href="#">Refund Policy</a>
      <a href="#">Privacy Policy</a>
      <a href="#">Terms of Use</a>
    </div>
    <p>Powered by <strong>SPRING / CØLD</strong> &copy; 2026. All rights reserved.</p>
  </footer>

  <script>
    const PRODUCTS = [
      {
        id: 1,
        title: "CØLD Heavyweight Oversized Tee",
        price: "35.00 €",
        frontImage: "https://via.placeholder.com/600x600/141414/ffffff?text=Koszulka+Prz%C3%B3d",
        backImage: "https://via.placeholder.com/600x600/141414/ba0000?text=Koszulka+Ty%C5%82"
      },
      {
        id: 2,
        title: "CØLD Signature Hoodie",
        price: "65.00 €",
        frontImage: "https://via.placeholder.com/600x600/141414/ffffff?text=Bluza+Prz%C3%B3d",
        backImage: "https://via.placeholder.com/600x600/141414/ba0000?text=Bluza+Ty%C5%82"
      },
      {
        id: 3,
        title: "CØLD Flame Bucket Hat",
        price: "28.00 €",
        frontImage: "https://via.placeholder.com/600x600/141414/ffffff?text=Czapka+Prz%C3%B3d",
        backImage: "https://via.placeholder.com/600x600/141414/ba0000?text=Czapka+Ty%C5%82"
      }
    ];

    let cartCount = 0;

    function renderProducts() {
      const container = document.getElementById('product-list');
      container.innerHTML = '';

      PRODUCTS.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="product-image-container">
            <img id="img-${product.id}" src="${product.frontImage}" alt="${product.title}">
            <button class="view-toggle" onclick="toggleView(${product.id})">🔄 Przód / Tył</button>
          </div>
          <div class="product-info">
            <div class="product-title">${product.title}</div>
            <div class="product-price">${product.price}</div>
            <button class="add-to-cart-btn" onclick="addToCart()">Dodaj do koszyka</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleView(productId) {
      const product = PRODUCTS.find(p => p.id === productId);
      const imgElem = document.getElementById(`img-${productId}`);
      if (imgElem.src === product.frontImage) {
        imgElem.src = product.backImage;
      } else {
        imgElem.src = product.frontImage;
      }
    }

    function addToCart() {
      cartCount++;
      document.getElementById('cart-count').innerText = cartCount;
    }

    window.onload = renderProducts;
  </script>
</body>
</html>
